<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171923">
  <meta name="description" content="GitHub Pagesで公開しているアプリのリンクと版数をまとめて確認するページ">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Pages Hub</title>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <div>
        <p class="eyebrow">GITHUB PAGES CONTROL ROOM</p>
        <h1>Pages Hub</h1>
        <p class="lead">公開中のアプリと、その現在地。</p>
      </div>
      <button id="refreshButton" class="refresh-button" type="button">
        <span aria-hidden="true">↻</span>
        <span>最新情報を取得</span>
      </button>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="表示設定">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="アプリ名を検索" autocomplete="off">
      </label>
      <div class="summary">
        <span id="statusText">読み込み中…</span>
        <time id="checkedAt"></time>
      </div>
    </section>

    <section id="projectGrid" class="project-grid" aria-live="polite"></section>

    <section id="emptyState" class="empty-state" hidden>
      <p>該当するアプリがない。</p>
    </section>

    <template id="projectTemplate">
      <article class="project-card">
        <div class="card-accent"></div>
        <div class="card-head">
          <div class="project-icon" aria-hidden="true"></div>
          <div class="card-title">
            <h2></h2>
            <p class="repo-name"></p>
          </div>
          <span class="publish-status">確認中</span>
        </div>

        <p class="description"></p>

        <dl class="metadata">
          <div>
            <dt>公開版</dt>
            <dd class="version-value skeleton">取得中</dd>
          </div>
          <div>
            <dt>最終更新</dt>
            <dd class="updated-value skeleton">取得中</dd>
          </div>
        </dl>

        <p class="commit-line">
          <span>commit</span>
          <code class="commit-value">-------</code>
        </p>

        <div class="primary-actions">
          <a class="button button--primary page-link" target="_blank" rel="noopener">開く</a>
          <a class="button button--latest latest-link" target="_blank" rel="noopener">
            <span aria-hidden="true">↗</span>
            最新版を開く
          </a>
        </div>

        <div class="secondary-actions">
          <button class="text-button copy-button" type="button">最新版URLをコピー</button>
          <a class="text-button repo-link" target="_blank" rel="noopener">GitHub</a>
        </div>
      </article>
    </template>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
